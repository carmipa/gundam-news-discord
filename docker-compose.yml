services:
  gundam-bot:
    build: .
    container_name: gundam-news-bot
    restart: unless-stopped
    tty: true
    stdin_open: true
    dns:
      - 8.8.8.8
      - 8.8.4.4

    # Variáveis de ambiente (do arquivo .env)
    env_file:
      - .env

    # Web dashboard: bind:host:container.
    # O bind default é 127.0.0.1 — o dashboard NÃO deve ficar exposto à internet.
    # Dentro do container o servidor escuta em 0.0.0.0 (e avisa no log); é esta
    # publicação que decide quem alcança a porta. Para expor de propósito, defina
    # HOST_WEB_BIND=0.0.0.0 no .env e ponha um proxy com TLS e auth à frente.
    # Se 8080 estiver ocupada no host, defina HOST_WEB_PORT (ex.: 8081).
    ports:
      - "${HOST_WEB_BIND:-127.0.0.1}:${HOST_WEB_PORT:-8080}:${WEB_PORT:-8080}"

    # Volumes para persistir dados
    volumes:
      # Arquivos de configuração e histórico
      - ./config.json:/app/config.json
      - ./history.json:/app/history.json
      - ./state.json:/app/state.json
      - ./sources.json:/app/sources.json

      # Cache de tradução: sem este volume o arquivo morre a cada `up --build`
      # e a varredura seguinte re-scrapa o Google em rajada (risco de bloqueio).
      - ./translation_cache.json:/app/translation_cache.json

      # Logs persistentes (opcional)
      - ./logs:/app/logs

    # Configuração de logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Política de restart
    # unless-stopped: reinicia sempre, exceto se parado manualmente

    # Healthcheck (herda do Dockerfile)

    # Labels para organização
    labels:
      com.gundam-bot.description: "Mafty Intelligence System"
      com.gundam-bot.version: "2.1"

    # Hardening de recursos (Compose local)
    cpus: "0.80"
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 256

    # Para ambientes Swarm/compatibilidade
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: 512M
          pids: 256
