name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Mesma versão da imagem de produção (Dockerfile). CI numa versão e
    # produção noutra deixa passar justamente o que só quebra na nova — foi o
    # caso do teste que travava a partir do 3.12.
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # Reprova: erro de sintaxe e nome indefinido (F821 já pegou defeito real
        # que o pytest não exercitava).
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Só informa.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Audit dependencies
      run: |
        # PYSEC-2022-252 (deep-translator) não tem versão de correção; aceite
        # conscientemente e mitigado por pin (ver requirements.txt). Ignorado POR
        # IDENTIDADE: qualquer vulnerabilidade nova reprova.
        pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-252

    - name: Test with pytest
      timeout-minutes: 10
      run: |
        pytest
